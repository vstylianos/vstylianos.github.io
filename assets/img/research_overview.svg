<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;display=swap');
      text { font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <!-- Subtle gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eef2f7;stop-opacity:1" />
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b5797" opacity="0.5"/>
    </marker>
    <!-- Glow filter for central figure -->
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2b5797" flood-opacity="0.1"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- ==================== LEFT PANEL: METHODS ==================== -->
  <g transform="translate(40, 40)">
    <text x="120" y="28" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="2">METHODS &amp; TOOLS</text>
    <line x1="40" y1="40" x2="200" y2="40" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Knowledge Representation Card -->
    <g transform="translate(0, 60)" filter="url(#cardShadow)">
      <rect width="240" height="110" rx="10" fill="white"/>
      <rect width="240" height="4" rx="2" fill="#2b5797" y="0" clip-path="inset(0 0 0 0 round 10px 10px 0 0)"/>
      <!-- Icon: connected nodes -->
      <g transform="translate(20, 25)">
        <circle cx="15" cy="15" r="8" fill="none" stroke="#2b5797" stroke-width="1.5"/>
        <circle cx="45" cy="5" r="6" fill="none" stroke="#2b5797" stroke-width="1.5"/>
        <circle cx="45" cy="30" r="6" fill="none" stroke="#2b5797" stroke-width="1.5"/>
        <circle cx="70" cy="18" r="7" fill="none" stroke="#2b5797" stroke-width="1.5"/>
        <line x1="23" y1="12" x2="39" y2="7" stroke="#2b5797" stroke-width="1" opacity="0.5"/>
        <line x1="23" y1="20" x2="39" y2="28" stroke="#2b5797" stroke-width="1" opacity="0.5"/>
        <line x1="51" y1="8" x2="63" y2="15" stroke="#2b5797" stroke-width="1" opacity="0.5"/>
        <line x1="51" y1="27" x2="63" y2="20" stroke="#2b5797" stroke-width="1" opacity="0.5"/>
        <!-- Small formal logic symbols -->
        <text x="5" y="60" font-size="10" fill="#94a3b8" font-style="italic">a &#x2227; b &#x2192; c</text>
      </g>
      <text x="120" y="95" font-size="14" font-weight="500" fill="#1e293b" text-anchor="middle">Knowledge Representation</text>
    </g>

    <!-- Reasoning Card -->
    <g transform="translate(0, 190)" filter="url(#cardShadow)">
      <rect width="240" height="110" rx="10" fill="white"/>
      <rect width="240" height="4" rx="2" fill="#3b82f6" y="0" clip-path="inset(0 0 0 0 round 10px 10px 0 0)"/>
      <!-- Icon: branching paths / decision tree -->
      <g transform="translate(20, 20)">
        <circle cx="40" cy="8" r="6" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
        <circle cx="15" cy="35" r="6" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
        <circle cx="65" cy="35" r="6" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
        <circle cx="5" cy="58" r="5" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
        <circle cx="28" cy="58" r="5" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
        <circle cx="55" cy="58" r="5" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
        <circle cx="75" cy="58" r="5" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
        <line x1="35" y1="13" x2="20" y2="30" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
        <line x1="45" y1="13" x2="60" y2="30" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
        <line x1="11" y1="40" x2="7" y2="53" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
        <line x1="19" y1="40" x2="25" y2="53" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
        <line x1="61" y1="40" x2="57" y2="53" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
        <line x1="69" y1="40" x2="73" y2="53" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
      </g>
      <text x="120" y="95" font-size="14" font-weight="500" fill="#1e293b" text-anchor="middle">Reasoning &amp; Planning</text>
    </g>

    <!-- Neurosymbolic AI Card -->
    <g transform="translate(0, 320)" filter="url(#cardShadow)">
      <rect width="240" height="110" rx="10" fill="white"/>
      <rect width="240" height="4" rx="2" fill="#6366f1" y="0" clip-path="inset(0 0 0 0 round 10px 10px 0 0)"/>
      <!-- Icon: neural net + logic symbol -->
      <g transform="translate(15, 18)">
        <!-- Neural net nodes -->
        <circle cx="10" cy="12" r="4" fill="#6366f1" opacity="0.3"/>
        <circle cx="10" cy="28" r="4" fill="#6366f1" opacity="0.3"/>
        <circle cx="10" cy="44" r="4" fill="#6366f1" opacity="0.3"/>
        <circle cx="35" cy="20" r="4" fill="#6366f1" opacity="0.5"/>
        <circle cx="35" cy="36" r="4" fill="#6366f1" opacity="0.5"/>
        <circle cx="58" cy="28" r="4" fill="#6366f1" opacity="0.7"/>
        <!-- Connections -->
        <line x1="14" y1="12" x2="31" y2="20" stroke="#6366f1" stroke-width="0.8" opacity="0.3"/>
        <line x1="14" y1="12" x2="31" y2="36" stroke="#6366f1" stroke-width="0.8" opacity="0.3"/>
        <line x1="14" y1="28" x2="31" y2="20" stroke="#6366f1" stroke-width="0.8" opacity="0.3"/>
        <line x1="14" y1="28" x2="31" y2="36" stroke="#6366f1" stroke-width="0.8" opacity="0.3"/>
        <line x1="14" y1="44" x2="31" y2="20" stroke="#6366f1" stroke-width="0.8" opacity="0.3"/>
        <line x1="14" y1="44" x2="31" y2="36" stroke="#6366f1" stroke-width="0.8" opacity="0.3"/>
        <line x1="39" y1="20" x2="54" y2="28" stroke="#6366f1" stroke-width="0.8" opacity="0.3"/>
        <line x1="39" y1="36" x2="54" y2="28" stroke="#6366f1" stroke-width="0.8" opacity="0.3"/>
        <!-- Plus sign -->
        <text x="68" y="33" font-size="16" fill="#6366f1" font-weight="300">+</text>
        <!-- Logic symbol -->
        <text x="80" y="34" font-size="13" fill="#6366f1" font-style="italic">&#x2200;x.P(x)</text>
      </g>
      <text x="120" y="95" font-size="14" font-weight="500" fill="#1e293b" text-anchor="middle">Neurosymbolic AI</text>
    </g>
  </g>

  <!-- ==================== FLOW ARROWS ==================== -->
  <!-- Left to center -->
  <line x1="300" y1="250" x2="370" y2="250" stroke="#2b5797" stroke-width="2" stroke-dasharray="6,4" opacity="0.3" marker-end="url(#arrowRight)"/>
  <!-- Center to right -->
  <line x1="830" y1="250" x2="900" y2="250" stroke="#2b5797" stroke-width="2" stroke-dasharray="6,4" opacity="0.3" marker-end="url(#arrowRight)"/>

  <!-- ==================== CENTER: HUMAN-AI INTERACTION ==================== -->
  <g transform="translate(400, 60)" filter="url(#softShadow)">
    <!-- Central area background -->
    <rect x="0" y="0" width="400" height="380" rx="16" fill="white" opacity="0.6"/>

    <!-- Human figure -->
    <g transform="translate(80, 160)">
      <!-- Head -->
      <circle cx="40" cy="20" r="22" fill="none" stroke="#2b5797" stroke-width="2"/>
      <!-- Eyes -->
      <circle cx="33" cy="17" r="2" fill="#2b5797"/>
      <circle cx="47" cy="17" r="2" fill="#2b5797"/>
      <!-- Smile -->
      <path d="M33,25 Q40,32 47,25" fill="none" stroke="#2b5797" stroke-width="1.5"/>
      <!-- Body -->
      <line x1="40" y1="42" x2="40" y2="90" stroke="#2b5797" stroke-width="2"/>
      <!-- Arms -->
      <line x1="40" y1="55" x2="15" y2="75" stroke="#2b5797" stroke-width="2"/>
      <line x1="40" y1="55" x2="65" y2="75" stroke="#2b5797" stroke-width="2"/>
      <!-- Legs -->
      <line x1="40" y1="90" x2="22" y2="120" stroke="#2b5797" stroke-width="2"/>
      <line x1="40" y1="90" x2="58" y2="120" stroke="#2b5797" stroke-width="2"/>
      <!-- Label -->
      <text x="40" y="145" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">Human</text>
    </g>

    <!-- Thought bubble from human -->
    <g transform="translate(55, 80)">
      <circle cx="75" cy="70" r="3" fill="#e2e8f0"/>
      <circle cx="68" cy="58" r="4" fill="#e2e8f0"/>
      <rect x="20" y="5" width="85" height="45" rx="20" fill="#e2e8f0"/>
      <text x="62" y="22" font-size="10" fill="#64748b" text-anchor="middle">beliefs</text>
      <text x="62" y="36" font-size="10" fill="#64748b" text-anchor="middle">goals</text>
    </g>

    <!-- Robot figure -->
    <g transform="translate(260, 160)">
      <!-- Head -->
      <rect x="18" y="0" width="44" height="38" rx="6" fill="none" stroke="#2b5797" stroke-width="2"/>
      <!-- Eyes -->
      <rect x="28" y="12" width="8" height="8" rx="2" fill="#2b5797" opacity="0.7"/>
      <rect x="44" y="12" width="8" height="8" rx="2" fill="#2b5797" opacity="0.7"/>
      <!-- Antenna -->
      <line x1="40" y1="0" x2="40" y2="-10" stroke="#2b5797" stroke-width="2"/>
      <circle cx="40" cy="-13" r="4" fill="#2b5797" opacity="0.5"/>
      <!-- Body -->
      <rect x="14" y="42" width="52" height="50" rx="4" fill="none" stroke="#2b5797" stroke-width="2"/>
      <!-- Chest detail -->
      <circle cx="40" cy="62" r="8" fill="none" stroke="#2b5797" stroke-width="1" opacity="0.4"/>
      <circle cx="40" cy="62" r="3" fill="#2b5797" opacity="0.3"/>
      <!-- Arms -->
      <line x1="14" y1="50" x2="-5" y2="75" stroke="#2b5797" stroke-width="2"/>
      <line x1="66" y1="50" x2="85" y2="75" stroke="#2b5797" stroke-width="2"/>
      <!-- Legs -->
      <rect x="20" y="92" width="14" height="28" rx="3" fill="none" stroke="#2b5797" stroke-width="2"/>
      <rect x="46" y="92" width="14" height="28" rx="3" fill="none" stroke="#2b5797" stroke-width="2"/>
      <!-- Label -->
      <text x="40" y="145" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">AI Agent</text>
    </g>

    <!-- Thought bubble from robot -->
    <g transform="translate(255, 80)">
      <circle cx="15" cy="70" r="3" fill="#e2e8f0"/>
      <circle cx="22" cy="58" r="4" fill="#e2e8f0"/>
      <rect x="-10" y="5" width="85" height="45" rx="20" fill="#e2e8f0"/>
      <text x="32" y="22" font-size="10" fill="#64748b" text-anchor="middle">model of</text>
      <text x="32" y="36" font-size="10" fill="#64748b" text-anchor="middle">human</text>
    </g>

    <!-- Interaction arrows between human and robot -->
    <g transform="translate(155, 220)">
      <!-- Bidirectional wavy arrows -->
      <path d="M10,0 Q45,-12 80,0" fill="none" stroke="#2b5797" stroke-width="1.5" opacity="0.6"/>
      <polygon points="80,0 73,-4 73,4" fill="#2b5797" opacity="0.6"/>
      <path d="M80,15 Q45,27 10,15" fill="none" stroke="#2b5797" stroke-width="1.5" opacity="0.6"/>
      <polygon points="10,15 17,11 17,19" fill="#2b5797" opacity="0.6"/>
      <text x="45" y="42" font-size="9" fill="#94a3b8" text-anchor="middle" font-style="italic">dialogue &amp; interaction</text>
    </g>

    <!-- Knowledge/Beliefs/Goals blocks between them -->
    <g transform="translate(160, 280)">
      <rect x="0" y="0" width="75" height="22" rx="4" fill="#2b5797" opacity="0.12"/>
      <text x="37" y="15" font-size="10" font-weight="500" fill="#2b5797" text-anchor="middle">knowledge</text>
      <rect x="0" y="28" width="75" height="22" rx="4" fill="#2b5797" opacity="0.12"/>
      <text x="37" y="43" font-size="10" font-weight="500" fill="#2b5797" text-anchor="middle">beliefs</text>
      <rect x="0" y="56" width="75" height="22" rx="4" fill="#2b5797" opacity="0.12"/>
      <text x="37" y="71" font-size="10" font-weight="500" fill="#2b5797" text-anchor="middle">goals</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: RESEARCH THEMES ==================== -->
  <g transform="translate(920, 85)">
    <text x="120" y="0" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="2">RESEARCH THEMES</text>
    <line x1="40" y1="12" x2="200" y2="12" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Theme pills -->
    <!-- Explainable Decision-Making -->
    <g transform="translate(0, 40)">
      <rect width="240" height="60" rx="10" fill="white" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="5" height="60" rx="2" fill="#2b5797"/>
      <text x="24" y="27" font-size="14" font-weight="500" fill="#1e293b">Explainable</text>
      <text x="24" y="46" font-size="14" font-weight="500" fill="#1e293b">Decision-Making</text>
    </g>

    <!-- Collaborative Decision-Making -->
    <g transform="translate(0, 120)">
      <rect width="240" height="60" rx="10" fill="white" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="5" height="60" rx="2" fill="#3b82f6"/>
      <text x="24" y="27" font-size="14" font-weight="500" fill="#1e293b">Collaborative</text>
      <text x="24" y="46" font-size="14" font-weight="500" fill="#1e293b">Decision-Making</text>
    </g>

    <!-- User Modeling -->
    <g transform="translate(0, 200)">
      <rect width="240" height="60" rx="10" fill="white" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="5" height="60" rx="2" fill="#6366f1"/>
      <text x="24" y="37" font-size="14" font-weight="500" fill="#1e293b">User Modeling</text>
    </g>

    <!-- Human-AI Psychology -->
    <g transform="translate(0, 280)">
      <rect width="240" height="60" rx="10" fill="white" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="5" height="60" rx="2" fill="#8b5cf6"/>
      <text x="24" y="27" font-size="14" font-weight="500" fill="#1e293b">Human-AI</text>
      <text x="24" y="46" font-size="14" font-weight="500" fill="#1e293b">Psychology</text>
    </g>
  </g>
</svg>
